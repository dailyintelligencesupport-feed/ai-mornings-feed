name: Sync podcast feed mirror

# Keeps feed.xml in this repo synced with the source feed on muse.ai,
# with the Apple/Spotify directory metadata injected by inject.py.
# Runs on weekday mornings (16:07 UTC, just after the 7:30 AM Pacific
# episode publishes) and any time you press "Run workflow".

on:
  schedule:
    - cron: "7 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch source feed and inject directory metadata
        env:
          FEED_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml
        run: python3 inject.py

      - name: Commit if the feed changed
        run: |
          git config user.name "feed-sync"
          git config user.email "feed-sync@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "Feed unchanged - nothing to commit."
          else
            git commit -m "Sync feed $(date -u +%F)"
            git push
          fi
